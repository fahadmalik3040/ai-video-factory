name: 24/7 AI Video Factory
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mass-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Ensure Remotion Browser
        run: npx --yes remotion browser ensure

      - name: Generate JSON (Middleware)
        run: npx --yes tsx src/scripts/1_generateJson.ts

      - name: Render Video (Headless WebGL CPU Mode)
        env:
          DISPLAY: :99
        run: xvfb-run --server-args="-screen 0 1920x1080x24" npm run render:cloud

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/
