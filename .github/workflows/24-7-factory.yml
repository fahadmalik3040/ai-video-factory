name: 24/7 AI Video Factory
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mass-production:
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Install Remotion Browser
        run: npx --yes remotion browser ensure
      - name: Generate Strict JSON (Groq API)
        run: npx --yes tsx src/scripts/1_generateJson.ts
      - name: Render 4K ProRes (Hardware Accelerated)
        run: npx --yes tsx src/scripts/2_renderLocal.ts
      - name: Upload Massive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-video-final
          path: out/
